<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#120b0a" />
      <stop offset="50%" stop-color="#1c100e" />
      <stop offset="100%" stop-color="#0a0505" />
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d80b24" />
      <stop offset="60%" stop-color="#f55d05" />
      <stop offset="100%" stop-color="#ffb800" />
    </linearGradient>
    <linearGradient id="pcbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f261c" />
      <stop offset="100%" stop-color="#071710" />
    </linearGradient>
    <linearGradient id="solarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a2b4c" />
      <stop offset="100%" stop-color="#0e182a" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bgGrad)" />

  <!-- Technical Grid Pattern -->
  <g opacity="0.08" stroke="#ffb800" stroke-width="1">
    <line x1="0" y1="50" x2="800" y2="50" />
    <line x1="0" y1="100" x2="800" y2="100" />
    <line x1="0" y1="150" x2="800" y2="150" />
    <line x1="0" y1="200" x2="800" y2="200" />
    <line x1="0" y1="250" x2="800" y2="250" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="350" x2="800" y2="350" />
    <line x1="0" y1="400" x2="800" y2="400" />
    <line x1="0" y1="450" x2="800" y2="450" />
    <line x1="100" y1="0" x2="100" y2="500" />
    <line x1="200" y1="0" x2="200" y2="500" />
    <line x1="300" y1="0" x2="300" y2="500" />
    <line x1="400" y1="0" x2="400" y2="500" />
    <line x1="500" y1="0" x2="500" y2="500" />
    <line x1="600" y1="0" x2="600" y2="500" />
    <line x1="700" y1="0" x2="700" y2="500" />
  </g>

  <!-- Ambient Glow Behind Prototype -->
  <circle cx="400" cy="250" r="180" fill="#f55d05" opacity="0.12" filter="url(#glow)" />
  <circle cx="280" cy="220" r="100" fill="#d80b24" opacity="0.15" filter="url(#glow)" />

  <!-- Header Banner -->
  <rect x="50" y="35" width="220" height="28" rx="14" fill="#d80b24" fill-opacity="0.18" stroke="#f55d05" stroke-opacity="0.4" />
  <text x="65" y="53" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#ffb800" letter-spacing="1.5">AARAMBH 3.0 • MAKER ARCHIVE</text>

  <!-- Prototype Title -->
  <text x="50" y="95" font-family="system-ui, sans-serif" font-size="22" font-weight="800" fill="#ffffff">KrishiSense IoT Telemetry Node</text>
  <text x="50" y="118" font-family="system-ui, sans-serif" font-size="12" fill="#c7b8ad">Prayatna 24h Hackathon Winner — Automated Soil Sensing &amp; Micro-Irrigation</text>

  <!-- Main Hardware Board Illustration (Center-Left) -->
  <g transform="translate(180, 150)">
    <!-- Main PCB Carrier -->
    <rect x="0" y="0" width="320" height="230" rx="12" fill="url(#pcbGrad)" stroke="#22c55e" stroke-opacity="0.5" stroke-width="2" />
    
    <!-- Copper Traces -->
    <g opacity="0.35" stroke="#4ade80" stroke-width="1.5" fill="none">
      <path d="M 20 40 L 80 40 L 95 60 L 140 60" />
      <path d="M 20 50 L 60 50 L 75 70 L 140 70" />
      <path d="M 140 160 L 170 160 L 190 190 L 290 190" />
      <path d="M 240 40 L 270 40 L 285 60 L 285 120" />
      <circle cx="80" cy="40" r="3" fill="#4ade80" />
      <circle cx="170" cy="160" r="3" fill="#4ade80" />
      <circle cx="270" cy="40" r="3" fill="#4ade80" />
    </g>

    <!-- ESP32 Module -->
    <rect x="30" y="60" width="90" height="110" rx="6" fill="#1e293b" stroke="#64748b" stroke-width="1.5" />
    <!-- ESP32 Metal RF Shield -->
    <rect x="38" y="90" width="74" height="70" rx="4" fill="#334155" stroke="#94a3b8" stroke-width="1" />
    <text x="75" y="125" font-family="monospace" font-size="9" font-weight="700" fill="#94a3b8" text-anchor="middle">ESP-WROOM-32</text>
    <text x="75" y="140" font-family="monospace" font-size="7" fill="#64748b" text-anchor="middle">IEDC CEK LAB</text>
    <!-- PCB Antenna Pattern -->
    <path d="M 45 68 L 45 82 L 53 82 L 53 68 L 61 68 L 61 82 L 69 82 L 69 68 L 77 68 L 77 82 L 85 82 L 85 68 L 93 68 L 93 82 L 100 82" stroke="#eab308" stroke-width="1.5" fill="none" />

    <!-- OLED Display Screen -->
    <rect x="145" y="35" width="145" height="95" rx="5" fill="#030712" stroke="#0284c7" stroke-width="1.5" />
    <rect x="150" y="40" width="135" height="85" fill="#000000" />
    <!-- OLED Text -->
    <text x="156" y="55" font-family="monospace" font-size="8" font-weight="700" fill="#38bdf8">» KRISHISENSE v1.4</text>
    <text x="156" y="70" font-family="monospace" font-size="9" fill="#4ade80">SOIL MOIST: 68.4%</text>
    <text x="156" y="84" font-family="monospace" font-size="9" fill="#facc15">NPK LEVEL : OPTIMAL</text>
    <text x="156" y="98" font-family="monospace" font-size="8" fill="#a855f7">LORA TX   : 868MHz OK</text>
    <text x="156" y="112" font-family="monospace" font-size="8" fill="#e2e8f0">VALVE     : STANDBY</text>

    <!-- LoRa Antenna (SMA Connector) -->
    <rect x="290" y="140" width="22" height="14" rx="2" fill="#d97706" />
    <path d="M 312 147 L 370 147 L 370 20" stroke="#f59e0b" stroke-width="3" fill="none" stroke-linecap="round" />
    <text x="375" y="40" font-family="monospace" font-size="8" fill="#fbbf24">3.2km LoRa</text>

    <!-- Status LEDs -->
    <circle cx="155" cy="155" r="4" fill="#22c55e" filter="url(#glow)" />
    <circle cx="170" cy="155" r="4" fill="#eab308" />
    <circle cx="185" cy="155" r="4" fill="#ef4444" opacity="0.3" />
    <text x="200" y="158" font-family="system-ui, sans-serif" font-size="8" fill="#9ca3af">PWR / RX / FAULT</text>

    <!-- Terminal Blocks (Sensor In) -->
    <rect x="145" y="180" width="60" height="30" rx="3" fill="#15803d" />
    <circle cx="158" cy="195" r="4" fill="#ca8a04" />
    <circle cx="175" cy="195" r="4" fill="#ca8a04" />
    <circle cx="192" cy="195" r="4" fill="#ca8a04" />
    <text x="145" y="222" font-family="monospace" font-size="7" fill="#86efac">PROBE IN</text>
  </g>

  <!-- Side Hardware Blocks (Right Column) -->
  <!-- Mini Solar Harvester -->
  <g transform="translate(570, 150)">
    <rect x="0" y="0" width="180" height="95" rx="8" fill="url(#solarGrad)" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1.5" />
    <!-- Grid on Solar Panel -->
    <line x1="45" y1="0" x2="45" y2="95" stroke="#0284c7" stroke-width="1" opacity="0.6" />
    <line x1="90" y1="0" x2="90" y2="95" stroke="#0284c7" stroke-width="1" opacity="0.6" />
    <line x1="135" y1="0" x2="135" y2="95" stroke="#0284c7" stroke-width="1" opacity="0.6" />
    <line x1="0" y1="48" x2="180" y2="48" stroke="#0284c7" stroke-width="1" opacity="0.6" />
    <text x="12" y="22" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#38bdf8">SOLAR HARVESTING</text>
    <text x="12" y="75" font-family="monospace" font-size="11" font-weight="700" fill="#ffffff">5V / 2.5W AUTO-CHARGE</text>
  </g>

  <!-- Soil Probe Sensor Representation -->
  <g transform="translate(570, 265)">
    <rect x="0" y="0" width="180" height="115" rx="8" fill="#18100e" stroke="#f55d05" stroke-opacity="0.3" stroke-width="1.5" />
    <text x="14" y="24" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#f55d05">CAPACITIVE SOIL ARRAY</text>
    <text x="14" y="42" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#ffffff">Corrosion-Resistant Probe</text>
    <text x="14" y="60" font-family="system-ui, sans-serif" font-size="9" fill="#a89b91">Calibrated for Karunagappally</text>
    <text x="14" y="73" font-family="system-ui, sans-serif" font-size="9" fill="#a89b91">paddy and coastal soil types</text>
    <!-- Live Metric Pill -->
    <rect x="14" y="85" width="125" height="18" rx="9" fill="#ffb800" fill-opacity="0.15" />
    <text x="24" y="97" font-family="monospace" font-size="8" font-weight="700" fill="#ffb800">WATER SAVED: ~42%</text>
  </g>

  <!-- Bottom Spec Bar -->
  <rect x="50" y="415" width="700" height="55" rx="10" fill="#0d0807" stroke="#251614" />
  <text x="70" y="438" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#ffffff">Engineered at CEKNPY</text>
  <text x="70" y="455" font-family="system-ui, sans-serif" font-size="10" fill="#8f8076">Team of 4 Undergraduate Builders (ECE &amp; CSE) • 24-Hour Offline Hackathon Sprint</text>

  <text x="470" y="438" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#ffb800">Aarambh 3.0 Recognition</text>
  <text x="470" y="455" font-family="system-ui, sans-serif" font-size="10" fill="#8f8076">Prayatna Hackathon 1st Prize • Selected for KSUM Prototype Seed Grant</text>
</svg>